name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 构建与单元测试
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 要扫全历史，浅克隆只有 1 个 commit
          fetch-depth: 0

      - name: 环境信息
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: 密钥扫描（gitleaks，扫全历史）
        run: |
          brew install gitleaks
          gitleaks version
          gitleaks detect --source . --redact --verbose

      - name: 构建内核与 App
        run: swift build --build-tests

      - name: 单元测试
        run: swift test

      - name: 用构建脚本打包通用 .app
        run: UNIVERSAL=1 ./scripts/build_app.sh

      - name: 校验产物
        run: |
          test -x build/AnywhereDo.app/Contents/MacOS/AnywhereDo
          lipo -info build/AnywhereDo.app/Contents/MacOS/AnywhereDo
          codesign -dv build/AnywhereDo.app 2>&1 | head -4

      - name: 校验版本号只有一处来源
        run: |
          PLIST=$(plutil -extract CFBundleShortVersionString raw build/AnywhereDo.app/Contents/Info.plist)
          SWIFT=$(grep -oE 'marketing *= *"[^"]+"' Sources/AnywhereDoCore/Version.swift | sed -E 's/.*"([^"]+)"/\1/')
          BINARY=$(build/AnywhereDo.app/Contents/MacOS/AnywhereDo --version | awk '{print $2}')
          echo "Info.plist=$PLIST  Version.swift=$SWIFT  二进制=$BINARY"
          [ "$PLIST" = "$SWIFT" ] && [ "$BINARY" = "$SWIFT" ] || { echo "❌ 版本号不一致"; exit 1; }
          echo "✅ 三处一致"

      - name: 冒烟测试（CLI 模式）
        run: |
          build/AnywhereDo.app/Contents/MacOS/AnywhereDo --analyze "https://github.com/apple/swift" | head -4
          printf '%s' '{"a":1}' | build/AnywhereDo.app/Contents/MacOS/AnywhereDo --analyze - | head -3

      - name: 上传 .app
        uses: actions/upload-artifact@v4
        with:
          name: AnywhereDo-app
          path: build/AnywhereDo.app
          if-no-files-found: error
